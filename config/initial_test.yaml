# Experiment configuration
# Experiment: initial_test

schema_version: 1

experiment:
  name: "initial_test"
  description: "North Atlantic, September 2025 - Initial test run"

  region: "North Atlantic"

  bbox:
    west: -30
    south: 30
    east: -10
    north: 50

  time_range:
    start: "2025-09-01"
    end: "2025-09-10"

sdp:
  # null = all 13 pigments
  pigments: null

io:
  input_dir: "data/input/initial_test"
  output:
    base_dir: "data/outputs"
    filename: "sdp_results.nc"
