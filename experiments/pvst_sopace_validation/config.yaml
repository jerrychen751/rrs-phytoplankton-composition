# Experiment configuration
# Experiment: pvst_sopace_validation

schema_version: 1

experiment:
  # Used for naming download/output folders (keep filesystem-friendly).
  name: "pvst_sopace_validation"
  description: "PVST SOPACE HPLC (KM2419, TN440, TN444) SeaBASS bundle"

  region: "PVST SOPACE"

  # Broad bounds for initial ingestion (dataset spans the tropical Pacific and
  # crosses the dateline; keep lon wide to avoid accidental filtering).
  bbox:
    west: -180
    south: -15
    east: 180
    north: 21

  # Derived from in-file timestamps (treating SeaBASS date/time as UTC).
  time_range:
    start: "2024-11-30"
    end: "2025-06-15"

validation:
  hplc:
    # Directory containing one or more SeaBASS HPLC files.
    path: "inputs/validation/in_situ_hplc"

  matching:
    time_window_hours: 3
    max_distance_km: 5
    neighborhood:
      box_size: 3
      min_valid_pixels: 6
    search_padding_deg: null
    max_granules_per_obs: 3

  qc:
    l2_flags:
      # See `experiments/pax_shearwater_validation/analysis/pace_qc/notes.md`.
      exclude_bits: [0, 1, 3, 4, 8, 9, 14, 16, 25, 26]
    spectral_homogeneity:
      max_cv: 0.15
      cv_wavelength_range_nm: [405, 570]
    pixel_spectral_validity:
      min_finite_fraction: 0.95

  spectral:
    interp_nm: 1
    smooth_nm: 5
    edge_trim_nm: 4
    final_range_nm: [400, 700]

pace:
  l2_aop_short_names:
    - "PACE_OCI_L2_AOP"
    - "PACE_OCI_L2_AOP_NRT"

sdp:
  # null = all 13 pigments
  pigments: null

io:
  downloads_dir: "~/Downloads/rrs-SDP-pigments"

  # Paths are resolved relative to this config file's directory when relative.
  input_dir: "inputs"

  pace_l2_rrs:
    output_subdir: "pace_l2_rrs"
    output_filename: "pace_l2_rrs_matchups.nc"
    keep_raw_granules: false
    raw_granules_subdir: "raw_granules"

  output:
    dir: "outputs"
    filename: "sdp_results.nc"
