# Copy this file to experiments/<experiment_name>/config.yaml and edit values.
#
# Experiment-centric folder layout (relative to this config file):
#   inputs/{rrs,sss,sst}/
#   outputs/
#
# Notes on path resolution:
# - Relative paths in this config resolve against this config file's directory.
# - Absolute paths and ~ (home dir) paths are supported.

schema_version: 1

experiment:
  # Required: Experiment name used for output folder naming (e.g., "initial_test", "pax_shearwater_validation")
  name: "experiment_name"

  description: "Brief description of the experiment purpose and data"

  # Optional: Region name (human-readable)
  region: "Region name (e.g., North Atlantic, Mediterranean Sea)"

  # Spatial bounds (west, south, east, north)
  # Longitude convention: west/east should be in the [-180, 180] range
  bbox:
    west: -30
    south: 30
    east: -10
    north: 50

  # Optional: Time range for the experiment data (format: YYYY-MM-DD)
  time_range:
    start: "YYYY-MM-DD"
    end: "YYYY-MM-DD"

# Optional: In-situ validation dataset and matching rules.
#
# Used by `scripts/data/download_pace_rrs.py` to build PACE L2 Rrs matchups
# (satellite spectra extracted at in-situ locations/times).
validation:
  hplc:
    # Path to a SeaBASS-derived in-situ dataset file (CSV or .sb), or a directory
    # containing multiple .sb/.csv files to be concatenated.
    #
    # Expected columns when using CSV:
    # - lat/lon (decimal degrees)
    # - date/time (UTC; configurable formats below)
    path: "inputs/validation/in_situ_hplc/<hplc_dataset>.csv"

    # Column mapping for CSV inputs (ignored for SeaBASS .sb inputs where fields are parsed).
    columns:
      lat: "lat"
      lon: "lon"
      date: "date"
      time: "time"
      station: "station"

    # Date/time parsing for CSV inputs.
    datetime:
      date_format: "%Y%m%d"   # e.g., 20240906
      time_format: "%H:%M:%S" # e.g., 21:01:00
      timezone: "UTC"

  matching:
    # Temporal window for considering satellite matchups.
    time_window_hours: 3

    # Maximum allowed station-to-pixel distance (km) after nearest-pixel selection.
    max_distance_km: 5

    neighborhood:
      # Spatial aggregation neighborhood size (3 => 3x3 pixels).
      box_size: 3
      # Minimum number of valid pixels in the neighborhood required to accept a matchup.
      min_valid_pixels: 6

    # Optional: padding (degrees) for the per-station CMR search bounding box.
    # If omitted, a reasonable default is derived from max_distance_km.
    search_padding_deg: null

    # Limit number of candidate granules downloaded per in-situ observation.
    max_granules_per_obs: 3

  qc:
    l2_flags:
      # Bits to exclude from `l2_flags` (see `experiments/pax_shearwater_validation/analysis/pace_qc/notes.md`).
      exclude_bits: [0, 1, 3, 4, 8, 9, 14, 16, 25, 26]

    spectral_homogeneity:
      # SeaBASS matchup tools default is 0.15 (median coefficient of variation threshold).
      # See: https://seabass.gsfc.nasa.gov/wiki/validation_matchup_tools
      max_cv: 0.15
      cv_wavelength_range_nm: [405, 570]

    pixel_spectral_validity:
      # Require that each pixel be finite for most wavelengths before it can contribute
      # to the neighborhood median spectrum.
      min_finite_fraction: 0.95

  spectral:
    # Apply paper-style preprocessing to the extracted (median) spectrum.
    interp_nm: 1
    smooth_nm: 5
    edge_trim_nm: 4
    final_range_nm: [400, 700]

pace:
  # Candidate CMR collection short_names to search for PACE OCI L2 AOP (contains Rrs).
  l2_aop_short_names:
    - "PACE_OCI_L2_AOP"
    - "PACE_OCI_L2_AOP_NRT"

sdp:
  # Pigments to predict: null = all 13, or list: [Tchla, Fuco, Zea]
  # Available: Tchla, Zea, DVchla, ButFuco, HexFuco, Allo, MVchlb, Neo, Viola, Fuco, Chlc12, Chlc3, Perid
  pigments: null

io:
  # Optional: where `scripts/data/download_pace_rrs.py` will write downloaded/matched outputs.
  # Defaults to ~/Downloads/rrs-SDP-pigments when unset.
  downloads_dir: "~/Downloads/rrs-SDP-pigments"

  # Required: Input data directory (relative to this config file or absolute path)
  input_dir: "inputs"

  pace_l2_rrs:
    # Subfolder under downloads_dir / experiment.name to store outputs.
    output_subdir: "pace_l2_rrs"
    # Structured matchup dataset output file name.
    output_filename: "pace_l2_rrs_matchups.nc"
    # Cache full downloaded L2 granules in the output folder.
    keep_raw_granules: false
    raw_granules_subdir: "raw_granules"

  # Output settings (recommended: use an experiment-local outputs directory)
  output:
    dir: "outputs"
    filename: "sdp_results.nc"
